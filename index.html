<!DOCTYPE html>
<html lang="en" data-theme="light">


<head>
<!-- page setup -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wubzy's Greeting Card Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
</head>
<body>

  <header>
<!-- page header -->
	<h1>Wubzy's Greeting Card Generator!</h1>
  </header>
  
<main>
<!-- card order section -->
	<section id="order-section">
	  <h2>Order a card</h2>
<!-- name input -->
	  <label>A Name
		<input id="name-input" type="text" />
	  </label>
<!-- adjective input -->
	  <label>An Adjective
		<input id="adjective-input" type="text" />
	  </label>
<!-- noun input -->
	  <label>A Noun
		<input id="noun-input" type="text" />
	  </label>
<!-- place input -->
	   <label>Favorite Place
		<input id="place-input" type="text" />
	  </label>
<!-- food input -->
	   <label>Favorite Food
		<input id="food-input" type="text" />
	  </label>
<!-- make card button -->
	   <button type="button" id="make-button">Make my Card</button>
	</section>
<!-- generated card section -->
	<section id="card-section">
	  <article>
<!-- generated card text -->
		<p id="card-text">Your card will appear here.</p>
<!-- random closing -->
		<p id="closing-text"></p>
<!-- surprise button -->
		<button type="button" id="surprise-button">Surprise ME</button>
	  </article>
	</section>	
</main>
  
  
  <footer>
<!-- page footer -->
	<p>Made by Shanae, 2026</p>
  </footer>

<!-- JavaScript file -->
  <script src="card.js"></script>
</body>
</html>

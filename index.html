<!DOCTYPE html>
<html lang="en" data-theme="light">


<head>
<!-- page setup -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wubzy's Words of Wonder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
<!-- page header -->
	<h1>Wubzy's Words of Wonder</h1>
	<p>A little humor, delivered by wubzy.</p>
  </header>
  
<main>
<!-- card order section -->
	<section id="order-section">
	  <h2>Create a Little Something Special</h2>
<!-- name input -->
	  <label>Who are you sending this card to?
		<input id="name-input" type="text" />
	  </label>
<!-- adjective input -->
	  <label>Describe them with a positive word!
		<input id="adjective-input" type="text" />
	  </label>
<!-- noun input -->
	  <label>Something special to them!
		<input id="noun-input" type="text" />
	  </label>
<!-- place input -->
	   <label>Their favorite place!
		<input id="place-input" type="text" />
	  </label>
<!-- food input -->
	   <label>Their favorite treat!
		<input id="food-input" type="text" />
	  </label>
<!-- make card button -->
	   <button type="button" id="make-button">Create my Card</button>
	</section>
<!-- generated card section -->
	<section id="card-section" hidden>
	  <article>
<!-- generated card text -->
		<p id="bonus-line" hidden>Wubzy has been watching.... and he's proud of you.</p>
		<p id="card-text">Your card will appear here.</p>
<!-- random closing -->
		<p id="closing-text"></p>
<!-- surprise button -->
		<button type="button" id="surprise-button">Surprise ME</button>
<!-- reset button -->
		<button type="button" id="reset-button">Reset</button>
	  </article>	  
	</section>	
</main>
  
  
  <footer>
<!-- page footer -->
	<p>Made by Shanae, 2026</p>
  </footer>

<!-- JavaScript file -->
  <script src="card.js"></script>
</body>
</html>
